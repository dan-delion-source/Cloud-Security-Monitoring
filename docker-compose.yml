# docker-compose.yml
version: "3.8"
services:
  localstack:
    image: localstack/localstack
    ports:
      - "4566:4566" # Main gateway port
    environment:
      - SERVICES=s3,lambda,dynamodb,sqs,sns,iam,sts,cloudtrail,ec2,secretsmanager
      - DEBUG=1
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
